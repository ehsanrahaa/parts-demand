name: آمار تقاضای قطعات

on:
  schedule:
    # هر ۲ ساعت بیدار می‌شود؛ حالت از تاریخچهٔ ارسال‌ها (meta) انتخاب می‌شود نه از ساعت:
    # گزارش روزانه اگر ۲۰ ساعت از آخری گذشته باشد، گزارش کامل اگر ماه عوض شده باشد، وگرنه هشدار.
    # GitHub زمان‌بند را دیر/نامنظم اجرا می‌کند؛ به ساعت ۰۴ UTC تکیه نمی‌کنیم.
    - cron: "10 */2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "بازه‌ی بازگشت به عقب (روز)"
        default: "365"
      pages:
        description: "حداکثر صفحه در هر کانال (هر صفحه ~۲۰ پست)"
        default: "40"
      mode:
        description: "full | daily | alerts | auto"
        default: "full"
  # backstop: هر تغییر واقعی در منابع یا کد همان لحظه یک دور هشدار می‌زند
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "catalog_seed.json"
      - "channels.txt"
      - "news.txt"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: parts-demand
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --no-cache-dir -r requirements.txt

      - name: بررسی Chrome برای ساخت PDF
        run: google-chrome --version || chromium --version

      - name: بازیابی پایگاه داده‌ی دورهای قبل
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch -q --depth 1 origin +refs/heads/state:refs/remotes/origin/state
            git show refs/remotes/origin/state:data/parts.db > data/parts.db || rm -f data/parts.db
          fi
          rm -f data/parts.db-wal data/parts.db-shm

      - name: تعیین بازه و حالت اجرا
        env:
          INPUT_DAYS: ${{ github.event.inputs.days }}
          INPUT_PAGES: ${{ github.event.inputs.pages }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          # زمان‌بند GitHub دیر یا نامنظم اجرا می‌کند؛ حالت را از آخرین ارسال‌های موفق می‌گیریم،
          # نه از ساعت شروع. هر اجرا اگر گزارش روزانه ۲۰ ساعت عقب افتاده باشد همان را می‌فرستد.
          mode=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            mode="$INPUT_MODE"
            [ "$mode" = "auto" ] && mode=""
          fi
          if [ -z "$mode" ]; then
            if ! git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
              mode=full   # اولین اجرا: ساخت پایه‌ی یک‌ساله
            else
              mode=$(python collector.py mode)
            fi
          fi
          case "$mode" in
            full)   days="${INPUT_DAYS:-365}"; pages="${INPUT_PAGES:-40}" ;;
            daily)  days=30; pages=10 ;;
            alerts) days=3;  pages=2 ;;
            *)      echo "حالت نامعتبر: $mode"; exit 1 ;;
          esac
          echo "MODE=$mode" >> "$GITHUB_ENV"
          echo "DAYS=$days" >> "$GITHUB_ENV"
          echo "PAGES=$pages" >> "$GITHUB_ENV"
          echo "این دور: mode=$mode days=$days pages=$pages"

      - name: ساخت کاتالوگ و تست تطبیق نام‌ها
        run: |
          python build_catalog.py
          python collector.py selftest

      - name: برداشت از کانال‌ها
        env:
          WORKERS: "3"
          MAX_RUNTIME: "2100"  # کمتر از timeout کار تا ذخیره‌ی وضعیت جا داشته باشد
        run: python -u collector.py collect --days "$DAYS" --pages "$PAGES"

      - name: استخراج دوباره و ساخت جدول‌ها
        run: |
          python collector.py rebuild
          if [ "$MODE" != "alerts" ]; then python collector.py report --top 500; fi

      - name: ارسال گزارش به تلگرام
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          case "$MODE" in
            full)  python -u collector.py digest --top 500 ;;   # PDF تاریخی + CSV
            daily) python -u collector.py digest --daily ;;     # PDF روزانه + PDF قیمت
            *)     python -u collector.py digest --alerts ;;    # فقط هشدار متنی
          esac

      - name: نگه‌داشتن خروجی‌ها
        if: env.MODE != 'alerts'
        uses: actions/upload-artifact@v4
        with:
          name: parts-report-${{ github.run_number }}
          path: out/
          retention-days: 90
          if-no-files-found: ignore

      - name: ذخیره‌ی پایگاه داده روی شاخه‌ی state
        if: always()
        env:
          GIT_TOKEN: ${{ secrets.STATE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f data/parts.db ]; then echo "پایگاه داده‌ای ساخته نشد"; exit 0; fi
          python - <<'EOF'
          import sqlite3
          c = sqlite3.connect("data/parts.db")
          c.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          c.close()
          EOF
          cp data/parts.db /tmp/parts.db
          git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin +refs/heads/state:refs/remotes/origin/state || true
          if git rev-parse --verify -q refs/remotes/origin/state >/dev/null; then
            git checkout -q -B state refs/remotes/origin/state
          else
            git checkout -q --orphan state
          fi
          mkdir -p data
          cp /tmp/parts.db data/parts.db
          git config user.name "parts-demand"
          git config user.email "parts-demand@users.noreply.github.com"
          git add -f data/parts.db
          git diff --cached --quiet || git commit -q -m "پایگاه داده‌ی تقاضای قطعات"
          git push -q origin HEAD:state
